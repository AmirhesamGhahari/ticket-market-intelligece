event_key: "nocturnal_wonderland_2026"
event_name: "Nocturnal Wonderland Music Festival 2026"
event_keyword: "nocturnal"
apify_actor_id: "raidr-api/facebook-marketplace-scraper"
seatgeek_event_id: null  # find at seatgeek.com — search Nocturnal Wonderland and grab the ID from the URL
radius_km: "500"

proxy:
  use_apify_proxy: true
  apify_proxy_groups: ["RESIDENTIAL"]
  apify_proxy_country: "US"

# ── Search terms ───────────────────────────────────────────────────────────────
# Shared across all cities and both run modes.
# Apify advanced mode caps at 50 searches per actor run — trim if you exceed that.

search_terms:
  - "nocturnal wonderland"
  - "nocturnal wonderland ticket"
  - "nocturnal wonderland 2026"
  - "nocturnal"
  - "nocturnal ticket"
  - "nocturnal pass"
  - "nocturnal 3 day"
  - "nocturnal wristband"
  - "nocturnal bracelet"
  - "nocturnal single day"
  - "nocturnal friday"
  - "nocturnal saturday"
  - "nocturnal sunday"
  - "nocturnal vip"
  - "nocturnal ga"
  - "nocturnal 2026"


# ── Initial run ────────────────────────────────────────────────────────────────
# Run once to capture the full available history (~30-day FB window).
# No date filter, no Apify-level dedup — get everything.
# One actor run is made per city.

initial_run:
  cities:
    - "San Bernardino, CA"
  use_deduplication: false
  fetch_detailed_items: false
  listings_per_search: 100
  filter_keywords: "nocturnal"

# ── Periodic run ───────────────────────────────────────────────────────────────
# Run every 6 hours. Apify dedup skips listings seen in prior runs.
# days_listed="1" keeps each search fast and cheap.

periodic_run:
  cities:
    - "San Bernardino, CA"
  use_deduplication: true
  fetch_detailed_items: false
  listings_per_search: 100
  #filter_keywords: "osheaga"
  days_listed: "1"
