event_key: "phoebe_bridgers_toronto_2026"
event_name: "Phoebe Bridgers Toronto 2026"
event_date: "2026-10-01"  # primary date for events table (earliest show)

# Multi-date: one StubHub task per entry; FB runs once for both nights.
event_dates:
  - date: "2026-10-01"
    stubhub_url: "https://www.stubhub.com/phoebe-bridgers-toronto-tickets-10-1-2026/event/161301918/?&quantity=0"
  - date: "2026-10-02"
    stubhub_url: "https://www.stubhub.com/phoebe-bridgers-toronto-tickets-10-2-2026/event/161321557/?quantity=0"

sources:

  facebook_legacy:
    enabled: true
    actor_id: "raidr-api/facebook-marketplace-scraper"
    proxy:
      use_apify_proxy: true
      apify_proxy_groups: ["RESIDENTIAL"]
      apify_proxy_country: "CA"
    radius_km: 500
    search_terms:
      - "phoebe bridgers"
      - "phoebe bridgers ticket"
      - "phoebe bridgers toronto"
      - "phoebe bridgers october"
      - "phoebe bridgers oct 1"
      - "phoebe bridgers oct 2"
    initial_run:
      cities:
        - "Toronto, Ontario"
      listings_per_search: 400
      use_deduplication: false
      fetch_detailed_items: false
      filter_keywords: "phoebe"
    periodic_run:
      cities:
        - "Toronto, Ontario"
      listings_per_search: 100
      days_listed: "30"
      use_deduplication: false
      fetch_detailed_items: false
      filter_keywords: "phoebe"

  facebook_new:
    enabled: true
    actor_id: "datavoyantlab/Facebook-marketplace-scraper"
    filter_keywords: ["phoebe"]
    marketplace_urls:
      - "https://www.facebook.com/marketplace/toronto/search/?query=phoebe+bridgers&exact=false"
      - "https://www.facebook.com/marketplace/toronto/search/?query=phoebe+bridgers+ticket&exact=false"
      - "https://www.facebook.com/marketplace/toronto/search/?query=phoebe+bridgers+toronto&exact=false"
      - "https://www.facebook.com/marketplace/toronto/search/?query=phoebe+bridgers+october&exact=false"
      - "https://www.facebook.com/marketplace/toronto/search/?query=phoebe+bridgers+oct+1&exact=false"
      - "https://www.facebook.com/marketplace/toronto/search/?query=phoebe+bridgers+oct+2&exact=false"
    initial_run:
      max_items: 1000
      fetch_item_details: false
      deduplicate_across_runs: true
      stop_on_first_page_all_duplicates: false
    periodic_run:
      max_items: 500
      fetch_item_details: false
      deduplicate_across_runs: true
      stop_on_first_page_all_duplicates: true

  seatgeek:
    enabled: false
    event_id: null

  stubhub:
    enabled: false
    # event_url is not used here — URLs come from event_dates list above.
    # To enable StubHub for Phoebe, set enabled: true.
    # The CLI will be called with --date 2026-10-01 and --date 2026-10-02 separately.
