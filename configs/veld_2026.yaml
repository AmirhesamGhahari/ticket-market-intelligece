# ── Initial run ────────────────────────────────────────────────────────────────
# Run once to capture the full available history (~30-day FB window).
# No date filter, no Apify-level dedup — get everything.
# One actor run is made per city.

initial_run:
  cities:
    - "Toronto, Ontario"
  use_deduplication: false
  fetch_detailed_items: false
  listings_per_search: 500
  filter_keywords: "veld"

# ── Periodic run ───────────────────────────────────────────────────────────────
# Run every 6 hours. Apify dedup skips listings seen in prior runs.
# days_listed="1" keeps each search fast and cheap.

periodic_run:
  cities:
    - "Toronto, Ontario"
  use_deduplication: true
  fetch_detailed_items: false
  listings_per_search: 100
  days_listed: "1"
