[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-tracker"
version = "0.1.0"
description = "Ticket Market Intelligence Platform — Backend Pipeline"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "loguru>=0.7",
    "rich>=13.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
run-pipeline = "ticket_tracker.run_pipeline:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_tracker"]

